<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Health Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Health Tracker</h1>
    <nav>
      {% if session.get("user_id") %}
        <a class="pill pill-today {% if request.endpoint == 'index' %}is-active{% endif %}"
           href="{{ url_for('index') }}">Today</a>
        <a class="pill pill-summary {% if request.endpoint == 'summary' %}is-active{% endif %}"
           href="{{ url_for('summary') }}">Summary</a>
        <form method="post" action="{{ url_for('logout') }}" class="logout-form">
          <button type="submit" class="pill">Log out</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
          {% for category, message in messages %}
            <li class="flash flash-{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
